[workspace]
resolver = "2"
members = [
  "crates/*"
]

# Workspace dependencies for consistency
[workspace.dependencies]
anyhow = "1.0.86"
log = "0.4.22"
metashrew-runtime = { path = "crates/metashrew-runtime" }
rockshrew-runtime = { path = "crates/rockshrew-runtime" }
metashrew-sync = { path = "crates/metashrew-sync" }
memshrew-runtime = { path = "crates/memshrew-runtime" }
prost = "0.12.6"
prost-build = "0.12.6"
tokio = { version = "1.43.0", features = ["full"] }
futures = "0.3.30"
sha2 = "0.10"

# Root package for running tests
[package]
name = "metashrew-tests"
version = "9.1.0-rc.2"
edition = "2021"

[dependencies]
# Core dependencies
anyhow = "1.0.86"
tokio = { version = "1.43.0", features = ["full"] }
futures = "0.3.30"
async-trait = "0.1"
log = "0.4.22"
env_logger = "0.11"
wasmtime = "49.0.2"

# Metashrew dependencies
metashrew-runtime = { path = "crates/metashrew-runtime" }
metashrew-support = { path = "crates/metashrew-support" }
rockshrew-runtime = { path = "crates/rockshrew-runtime" }
metashrew-sync = { path = "crates/metashrew-sync", features = ["test-utils"] }
rockshrew-mono = { path = "crates/rockshrew-mono" }
memshrew-runtime = { workspace = true }

# Database dependencies
rocksdb = "0.21.0"
tempfile = "3.8"
sha2 = "0.10"

# Serialization dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstd = "0.13"

# Bitcoin dependencies
bitcoin = "0.32.6"
hex = "0.4"

# Test dependencies
[dev-dependencies]
tokio-test = "0.4.4"
env_logger = "0.11.8"
log = "0.4.27"
reqwest = { version = "0.12.12", features = ["json"] }
actix-web = { version = "4.9.0", default-features = false, features = [
    # Every actix-web default feature except `http2`: the server binds plain
    # HTTP/1.1 (`HttpServer::bind`), so h2c/ALPN is never negotiated, and
    # `http2` is what pulls h2 0.3 (RUSTSEC-2026-0258, no 0.3 fix) into the
    # binary through actix-http.
    "macros", "compress-brotli", "compress-gzip", "compress-zstd",
    "cookies", "unicode", "compat", "ws",
] }
actix-cors = "0.7.0"

# Build dependencies for compiling WASM
[build-dependencies]
# No additional build dependencies needed - using cargo directly
