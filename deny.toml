# cargo-deny configuration. CI runs:
#   cargo deny --workspace --locked check advisories bans sources
# with the default feature set, which is what the production
# rockshrew-mono binary is built with.
#
# Not covered by CI: the non-default `rockshrew-mono/ssh-tunnel` feature
# (also enabled by `ssh_e2e_tests`). It pulls russh 0.50, which carries
# RUSTSEC-2026-0153, RUSTSEC-2026-0154, RUSTSEC-2023-0071 (rsa, no fix)
# and further GHSA-only advisories. Production uses plain http:// and
# does not compile it. Upgrading russh to >= 0.60.3 or deleting the
# feature is the follow-up; check it with
#   cargo deny --workspace --all-features check advisories

[graph]
all-features = false
no-default-features = false

[advisories]
# Every vulnerability, unsound, unmaintained and notice advisory fails
# the job unless listed here with a reason.
#
# Add entries only as
#   { id = "RUSTSEC-YYYY-NNNN", reason = "why it cannot be fixed, and why it is not reachable" },
#
# The two wasmtime entries are closed by wasmtime 49.0.4. The indexer
# runtime (wasmtime) changes only through its own reviewed runtime
# upgrade, never inside a dependency-security release. Both are
# unreachable in this tree, so they wait for that upgrade. Remove both
# entries when wasmtime moves to >= 49.0.4.
ignore = [
    { id = "RUSTSEC-2026-0379", reason = "Cranelift aarch64 backend only; production rockshrew-mono is built and run on x86_64 only. Fixed by wasmtime 49.0.4 (next runtime upgrade)" },
    { id = "RUSTSEC-2026-0378", reason = "component-model streams only; metashrew runs core wasm modules and never uses wasmtime::component. Fixed by wasmtime 49.0.4 (next runtime upgrade)" },
]
# A yanked crate in Cargo.lock is a warning, not a failure: yanks are
# not security advisories and would otherwise break unrelated PRs.
yanked = "warn"

[bans]
multiple-versions = "allow"
# Workspace members depend on each other by path with no version, which
# cargo-deny counts as wildcards (allow-wildcard-paths only covers
# `publish = false` crates). There are no registry wildcards today.
wildcards = "allow"
# Regression guards for the audit findings: none of these may come back
# into the default-feature (production) graph. They use the
# `{ name, version }` form on purpose. cargo-deny 0.20.2 drops the operator
# in the `crate = "name@<req>"` form and matches the bare version exactly
# (checked against the rc.5 lockfile: `zstd@<=0.14.2` and `zstd@<0.14.3`
# did not match zstd 0.13.3, `tokio@<1.51.6` matched 1.51.6), so the
# `@<=` guards before rc.6 only banned the one version they named.
# `version = "<=X"` is a real semver range. Each range is checked by
# running this file against the lockfile it guards against.
deny = [
    { name = "h2", version = "<=0.4.15", reason = "RUSTSEC-2026-0258 (unbounded empty DATA frames); h2 0.3 has no fix" },
    { name = "hyper", version = "<=0.14.99", reason = "hyper 0.14 is what pulled in h2 0.3" },
    { name = "actix-http", version = "<=3.12.0", reason = "GHSA-xhj4-vrgc-hr34 (CL.TE request smuggling)" },
    { name = "wasmtime", version = "<=49.0.2", reason = "17 RustSec advisories closed by 48.0.4 / 49.0.2, then RUSTSEC-2026-0353..0364 (12) closed by 49.0.3" },
    { name = "rustls-webpki", version = "<=0.103.15", reason = "RUSTSEC-2026-0382 / CVE-2026-111943 (distrusted intermediates accepted)" },
    { name = "rustls", version = "<=0.23.45", reason = "RUSTSEC-2026-0346..0349" },
    { name = "webpki-roots", version = "<=1.0.9", reason = "RUSTSEC-2026-0381 / CVE-2026-111943 (distrusted roots bundled); use >= 1.0.10" },
    { name = "tokio", version = "<=1.51.5", reason = "RUSTSEC-2026-0386 (AsyncFd I/O safety), fixed in the 1.51 LTS at 1.51.6" },
    { name = "zstd", version = "<=0.14.2", reason = "RUSTSEC-2026-0391 (stream context reuse leaks data); 0.13 has no fix" },
    { name = "zstd-safe", version = "<=8.1.99", reason = "RUSTSEC-2026-0398 (seekable), RUSTSEC-2026-0403 (legacy-frame stream decode exposes uninitialized memory)" },
    { name = "zstd-sys", version = "<=2.1.1", reason = "RUSTSEC-2026-0410 (wasm32 allocator shim)" },
    { crate = "wasmtime-internal-cache", reason = "wasmtime's `cache` feature: unused, and pulled zstd 0.13 (see the workspace wasmtime features)" },
    { crate = "russh", reason = "pre-auth advisories; allowed only behind the non-default ssh-tunnel feature" },
    { crate = "russh-keys", reason = "see russh" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
