[package]
name = "metashrew-core"
version = "10.0.0-alpha.3"
description = "metashrew indexer bindings"
repository = "https://github.com/sandshrewmetaprotocols/metashrew"
license = "MIT"
edition = "2021"
resolver = "2"



[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bitcoin = "0.31.2"
bytes = "1.6.0"
cfg-if = "1.0.0"
wasm-bindgen = "0.2.100"
ordinals = "0.0.8"
prost.workspace = true
anyhow = "1.0.89"
wasm-bindgen-test = "0.3.49"
hex = "0.4.3"
metashrew-support = { path = "../metashrew-support" }

[build-dependencies]
prost-build.workspace = true

[features]
test-utils = []
panic-hook = []
allocator = []
debug-log = []
# v10 view-syscall wasm-side wrapper. Off by default — wasm authors
# opt in to the cache_get / cache_put / (future) spawn helpers by
# building with `--features view-syscalls`. Pre-v10 wasm builds stay
# byte-identical with the feature off.
view-syscalls = []
# v10 indexer-syscall wasm-side wrappers (BatchGet, ConflictRead/Write,
# IndexerThreadSpawn/Join). Off by default — wasm authors opt in via
# `--features indexer-syscalls` to access the Block-STM parallel
# execution primitives. Sequential indexer builds stay byte-identical
# with the feature off.
indexer-syscalls = []
default = ["allocator"]
