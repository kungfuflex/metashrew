[package]
name = "memshrew-p2p"
version = "9.1.0-rc.6"
edition = "2021"

[dependencies]
actix-web = { version = "4.9.0", default-features = false, features = [
    # Every actix-web default feature except `http2`: the server binds plain
    # HTTP/1.1 (`HttpServer::bind`), so h2c/ALPN is never negotiated, and
    # `http2` is what pulls h2 0.3 (RUSTSEC-2026-0258, no 0.3 fix) into the
    # binary through actix-http. Also without `compress-zstd`: no handler uses
    # the Compress middleware, and with it actix-http decoded any request body
    # sent with `Content-Encoding: zstd` through zstd 0.13's stream::write::Decoder
    # (RUSTSEC-2026-0403). Such bodies now reach the handler undecoded and
    # fail to parse.
    "macros", "compress-brotli", "compress-gzip",
    "cookies", "unicode", "compat", "ws",
] }
itertools = "0.14.0"
clap = { version = "4.5.26", features = ["unstable-doc"] }
reqwest = { version = "0.12.12", features = ["json"] }
tokio = { version = "1.43.0", features = ["full"] }
futures = "0.3.31"
env_logger = "0.11.6"
hex = "0.4.3"
anyhow = "1.0.95"
bitcoin = { version = "0.32.5", features = ["serde", "rand"] }
log = "0.4.25"
actix-cors = "0.7.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
rand = "0.9.0"
