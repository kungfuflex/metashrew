[package]
name = "metashrew-sync"
version = "10.0.0-alpha.3"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
tokio = { version = "1.43.0", features = ["full", "test-util"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.136"
log = "0.4.25"
hex = "0.4.3"
async-trait = "0.1.83"
thiserror = "1.0.69"
num_cpus = "1.16.0"
bitcoin = "0.32.4"
metashrew-validator-core = { path = "../metashrew-validator-core" }
rocksdb = "0.21.0"
sha2 = "0.10"
metashrew-runtime = { path = "../metashrew-runtime" }

[features]
default = []
test-utils = []
