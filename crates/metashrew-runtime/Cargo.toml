[package]
name = "metashrew-runtime"
version = "10.0.0-alpha.3"
edition = "2021"

[dependencies]
anyhow = "1.0.75"
prost = "0.12.1"
prost-build = "0.12.1"
wasmtime = "43"
itertools = "0.12.0"
log = "0.4.20"
hex = "0.4.3"
tokio = { workspace = true, features = ["full"] }
sha2 = { workspace = true }
# sysinfo powers the host-memory floor check on the view path. We refresh
# the cached value at most every `memory_floor_refresh_ms` (default 1s) so
# we do not add per-call latency to view-runtime acquire.
sysinfo = { version = "0.30", default-features = false }
thiserror = "1.0"
# v10 view-syscall cache. `lru_mem` is a memory-bounded LRU; we use it
# for the host-side ViewCache that backs the CacheGet / CachePut ops
# under __flush in view mode. Same crate the kungfuflex/lru-cache branch
# used for the wasm-side cache.
lru-mem = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
# Inline-WAT fixtures for the view-thread integration test. `wat` is
# already a transitive dep through wasmtime, but we cite it explicitly
# so the test target sees it.
wat = "1"
# In-memory KV adapter for end-to-end view-thread tests (build a real
# MetashrewRuntime, invoke its view path, watch the spawn/join syscalls
# fire). The adapter lives in memshrew-runtime which depends on us, so
# we use a directed dev-dep cycle (only loaded for tests).
memshrew-runtime = { path = "../memshrew-runtime" }

[build-dependencies]
prost-build.workspace = true

