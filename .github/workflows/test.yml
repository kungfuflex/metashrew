name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install protoc
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    # Toolchain, components and the wasm32 target come from rust-toolchain.toml.
    - name: Install Rust
      run: rustup toolchain install

    - name: Cache cargo registry
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build metashrew-minimal WASM
      run: cargo build --locked --target wasm32-unknown-unknown --release -p metashrew-minimal

    - name: Run tests
      run: cargo test --locked --release -- --test-threads=1
